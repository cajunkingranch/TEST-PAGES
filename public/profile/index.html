<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NySa — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-dim: rgba(201,168,76,0.18);
      --bg: #000000;
      --text: #E8E0D0;
      --muted: rgba(232,224,208,0.4);
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ── Vignette + vault depth ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 38%,
          rgba(28,20,10,0.0) 0%,
          rgba(18,13,6,0.45) 55%,
          rgba(0,0,0,0.88) 100%
        );
    }

    /* Subtle hue-shift layer for bond level-up — triggered via JS */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 35%, rgba(201,168,76,0.09) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 1s ease;
    }

    body.bond-pulse::after { opacity: 1; }

    /* ── Back link ── */
    .back {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      text-decoration: none;
      z-index: 100;
      transition: opacity 0.3s ease;
      animation: fade-in 0.6s ease 1.6s forwards;
    }
    .back:hover { opacity: 1 !important; }

    @keyframes fade-in {
      to { opacity: 0.55; }
    }

    /* ── Screen ── */
    .screen {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 72px 32px 60px;
    }

    /* ══════════════════════════
       THE ORB
    ══════════════════════════ */
    .orb-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      opacity: 0;
      animation: orb-enter 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }

    @keyframes orb-enter {
      0%   { opacity: 0; transform: scale(0.88); }
      100% { opacity: 1; transform: scale(1); }
    }

    .orb-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      margin-bottom: 32px;
    }

    /* Outermost breathing ring */
    .orb-ring-outer {
      position: absolute;
      inset: -28px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(201,168,76,0.06) 0%,
        rgba(180,130,60,0.03) 50%,
        transparent 70%
      );
      filter: blur(18px);
      animation: breathe-outer 4s ease-in-out infinite;
    }

    @keyframes breathe-outer {
      0%, 100% { transform: scale(1);    opacity: 0.6; }
      50%       { transform: scale(1.12); opacity: 1; }
    }

    /* Mid glow ring */
    .orb-ring-mid {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(201,168,76,0.14) 0%,
        rgba(180,130,60,0.07) 45%,
        transparent 70%
      );
      filter: blur(10px);
      animation: breathe-mid 4s ease-in-out 0.4s infinite;
    }

    @keyframes breathe-mid {
      0%, 100% { transform: scale(1);    opacity: 0.7; }
      50%       { transform: scale(1.07); opacity: 1; }
    }

    /* Inner orb itself */
    .orb {
      position: relative;
      z-index: 2;
      width: 170px;
      height: 170px;
      border-radius: 50%;

      /* Deep dark amber core */
      background:
        radial-gradient(circle at 38% 32%,
          rgba(120,80,20,0.7) 0%,
          rgba(60,40,10,0.85) 35%,
          rgba(18,12,4,0.97) 70%
        );

      /* Multi-layer SVG-style filter glow via box-shadow */
      box-shadow:
        0 0  18px  2px rgba(201,168,76,0.22),
        0 0  40px  8px rgba(180,130,60,0.14),
        0 0  80px 20px rgba(140,100,40,0.08),
        inset 0 0  30px rgba(201,168,76,0.06);

      border: 1px solid rgba(201,168,76,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Amber shimmer inside the orb */
    .orb::before {
      content: '';
      position: absolute;
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%,
        rgba(201,168,76,0.35) 0%,
        rgba(160,110,40,0.15) 50%,
        transparent 75%
      );
      filter: blur(8px);
      animation: shimmer 4s ease-in-out 0.8s infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.6; transform: scale(1) translate(0,0); }
      50%       { opacity: 1;   transform: scale(1.1) translate(2%, -2%); }
    }

    /* Silhouette */
    .orb svg { position: relative; z-index: 1; opacity: 0.28; }

    /* ── Archetype + name ── */
    .archetype-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.65;
      margin-bottom: 10px;
    }

    .companion-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 52px;
      letter-spacing: 0.03em;
      color: var(--text);
      line-height: 1;
      margin-bottom: 10px;
    }

    .bond-status {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-style: italic;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* ══════════════════════════
       ATTRIBUTES — floating cloud
    ══════════════════════════ */
    .attributes {
      text-align: center;
      margin: 28px 0 32px;
      line-height: 2.1;
      opacity: 0;
      animation: fade-up 0.7s ease 1.0s forwards;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .attributes p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 15px;
      color: rgba(232,224,208,0.65);
      letter-spacing: 0.04em;
    }

    .attr-dot {
      display: inline-block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
      vertical-align: middle;
      margin: 0 10px;
    }

    /* ══════════════════════════
       STATS — fluid, no boxes
    ══════════════════════════ */
    .stats {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0;
      width: 100%;
      margin-bottom: 36px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      opacity: 0;
    }

    /* Stagger in via JS */
    .stat.visible {
      animation: stat-in 0.5s ease forwards;
    }

    @keyframes stat-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 38px;
      line-height: 1;
      color: var(--text);
      letter-spacing: -0.01em;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }

    /* Thin gold divider between stats — no box, just a breath */
    .stat-sep {
      width: 1px;
      height: 28px;
      background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.25), transparent);
      align-self: center;
      flex-shrink: 0;
    }

    /* ══════════════════════════
       BOND DEPTH
    ══════════════════════════ */
    .bond-section {
      width: 100%;
      margin-bottom: 44px;
      opacity: 0;
      animation: fade-up 0.7s ease 1.3s forwards;
    }

    .bond-top {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 12px;
    }

    .bond-word {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .bond-state {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 16px;
      color: rgba(201,168,76,0.75);
      letter-spacing: 0.05em;
    }

    /* Soft blurred gradient trail — not a progress bar */
    .bond-trail {
      position: relative;
      height: 6px;
      border-radius: 6px;
      background: rgba(255,255,255,0.04);
      overflow: visible;
    }

    .bond-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 63%;
      border-radius: 6px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(201,168,76,0.2) 20%,
        rgba(201,168,76,0.55) 70%,
        rgba(201,168,76,0.8) 100%
      );
      filter: blur(1.5px);
      box-shadow: 0 0 14px 4px rgba(201,168,76,0.18);
    }

    /* Soft terminus glow dot */
    .bond-fill::after {
      content: '';
      position: absolute;
      right: -2px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(201,168,76,0.9);
      box-shadow: 0 0 10px 4px rgba(201,168,76,0.4), 0 0 24px 8px rgba(201,168,76,0.15);
      filter: blur(0.5px);
    }

    /* ══════════════════════════
       CTA — Ghost entrance button
    ══════════════════════════ */
    .enter-btn {
      width: 100%;
      padding: 20px 24px;
      background: transparent;
      border: 1px solid rgba(201,168,76,0.32);
      border-radius: 14px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      font-weight: 300;
      font-style: italic;
      color: rgba(232,224,208,0.85);
      letter-spacing: 0.08em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: color 0.4s ease;
      opacity: 0;
      animation: fade-up 0.7s ease 1.5s forwards;

      /* Inner glow */
      box-shadow:
        inset 0 0 20px rgba(201,168,76,0.04),
        0 0 0 0 rgba(201,168,76,0);
    }

    /* Border pulse on hover */
    .enter-btn:hover {
      color: rgba(232,224,208,1);
      animation: fade-up 0s forwards, border-pulse 2s ease-in-out infinite;
    }

    @keyframes border-pulse {
      0%, 100% {
        box-shadow:
          inset 0 0 20px rgba(201,168,76,0.06),
          0 0  0px 0px rgba(201,168,76,0);
        border-color: rgba(201,168,76,0.32);
      }
      50% {
        box-shadow:
          inset 0 0 28px rgba(201,168,76,0.1),
          0 0 18px 2px rgba(201,168,76,0.1);
        border-color: rgba(201,168,76,0.6);
      }
    }

    /* Shimmer sweep on hover */
    .enter-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(201,168,76,0.05) 50%,
        transparent 100%
      );
      transition: left 0.6s ease;
    }

    .enter-btn:hover::before { left: 100%; }
  </style>
</head>
<body>
  <a href="/" class="back">← Gallery</a>

  <div class="screen">

    <!-- ORB -->
    <div class="orb-section">
      <div class="orb-wrap">
        <div class="orb-ring-outer"></div>
        <div class="orb-ring-mid"></div>
        <div class="orb">
          <svg width="56" height="56" viewBox="0 0 70 70" fill="none">
            <circle cx="35" cy="24" r="13" fill="rgba(201,168,76,0.75)"/>
            <path d="M10 62 Q10 44 35 44 Q60 44 60 62" fill="rgba(201,168,76,0.75)"/>
          </svg>
        </div>
      </div>

      <p class="archetype-label">The Slow Burn</p>
      <h1 class="companion-name">NySa</h1>
      <p class="bond-status">Day 47 &mdash; Deepening</p>
    </div>

    <!-- ATTRIBUTES -->
    <div class="attributes">
      <p>
        <em>Emotionally perceptive</em>
        <span class="attr-dot"></span>
        <em>Patient</em>
        <span class="attr-dot"></span>
        <em>Quietly intense</em>
      </p>
      <p>
        <em>Remembers everything</em>
        <span class="attr-dot"></span>
        <em>Speaks only when it matters</em>
      </p>
    </div>

    <!-- STATS -->
    <div class="stats" id="stats">
      <div class="stat" data-delay="0">
        <div class="stat-num">47</div>
        <div class="stat-label">Days<br/>Together</div>
      </div>
      <div class="stat-sep"></div>
      <div class="stat" data-delay="120">
        <div class="stat-num">312</div>
        <div class="stat-label">Shared<br/>Moments</div>
      </div>
      <div class="stat-sep"></div>
      <div class="stat" data-delay="240">
        <div class="stat-num">18</div>
        <div class="stat-label">Memories<br/>Held</div>
      </div>
    </div>

    <!-- BOND DEPTH -->
    <div class="bond-section">
      <div class="bond-top">
        <span class="bond-word">Bond Depth</span>
        <span class="bond-state">Deepening — something is beginning to settle.</span>
      </div>
      <div class="bond-trail">
        <div class="bond-fill"></div>
      </div>
    </div>

    <!-- CTA -->
    <button class="enter-btn" onclick="triggerBondPulse()">
      Enter Conversation
    </button>

  </div>

  <script>
    // Stagger stats in after orb entrance
    const stats = document.querySelectorAll('.stat');
    stats.forEach(stat => {
      const delay = parseInt(stat.dataset.delay) + 900;
      setTimeout(() => stat.classList.add('visible'), delay);
    });

    // Bond level-up background hue shift
    function triggerBondPulse() {
      document.body.classList.add('bond-pulse');
      setTimeout(() => document.body.classList.remove('bond-pulse'), 3000);
    }
  </script>
</body>
</html>
