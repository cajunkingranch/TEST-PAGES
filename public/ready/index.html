<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NySa — She's Ready</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #C9A84C; --gold-dim: rgba(201,168,76,0.22); --bg: #0A0A0A; --text: #E8E0D0; --muted: rgba(232,224,208,0.45); }
    html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-weight: 300; }
    body {
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 30%, rgba(201,168,76,0.08) 0%, transparent 65%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(201,168,76,0.04) 0%, transparent 55%);
    }

    .back { position: fixed; top: 18px; left: 18px; font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); opacity: 0.55; text-decoration: none; z-index: 100; transition: opacity 0.3s; }
    .back:hover { opacity: 1; }

    .screen { min-height: 100vh; max-width: 480px; margin: 0 auto; padding: 64px 28px 100px; display: flex; flex-direction: column; }

    .step-dots { display: flex; gap: 10px; margin-bottom: 40px; padding-top: 8px; }
    .dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
    .dot.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.12); box-shadow: 0 0 12px rgba(201,168,76,0.25); }
    .dot.done { border-color: rgba(201,168,76,0.4); color: rgba(201,168,76,0.6); }

    h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 40px; line-height: 1.15; color: var(--text); margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 36px; }

    /* Preview card */
    .preview-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--gold-dim);
      border-radius: 20px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(16px);
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .preview-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(201,168,76,0.06) 0%, transparent 60%);
    }

    /* Orb placeholder */
    .orb-wrap { position: relative; width: 120px; height: 120px; margin-bottom: 24px; }
    .orb-outer { position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(circle, rgba(201,168,76,0.1) 0%, transparent 70%); filter: blur(10px); animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    .orb {
      width: 120px; height: 120px; border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, rgba(201,168,76,0.2) 0%, rgba(30,22,12,0.95) 70%);
      border: 1px solid rgba(201,168,76,0.25);
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 1;
      box-shadow: 0 0 24px rgba(201,168,76,0.1);
      overflow: hidden;
    }
    .orb img { width: 100%; height: 100%; object-fit: cover; object-position: center top; border-radius: 50%; opacity: 0.85; mask-image: radial-gradient(circle, black 55%, transparent 85%); -webkit-mask-image: radial-gradient(circle, black 55%, transparent 85%); }

    .companion-name-display { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--text); margin-bottom: 4px; }
    .companion-meta { font-size: 13px; color: var(--gold); opacity: 0.7; letter-spacing: 0.06em; margin-bottom: 24px; }

    .divider { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); margin-bottom: 16px; }

    .detail-row { display: flex; gap: 8px; font-size: 12px; color: var(--muted); justify-content: center; }
    .detail-label { color: rgba(232,224,208,0.3); }

    /* Bottom */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 16px 28px 32px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to top, rgba(10,10,10,1) 60%, transparent); }
    .back-btn { padding: 14px 24px; border: 1px solid var(--gold-dim); border-radius: 12px; background: transparent; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); cursor: pointer; transition: all 0.3s; }
    .back-btn:hover { color: var(--text); border-color: rgba(201,168,76,0.4); }
    .bring-btn {
      padding: 16px 36px;
      background: linear-gradient(135deg, rgba(201,168,76,0.9), rgba(201,168,76,0.65));
      border: none; border-radius: 14px;
      font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; font-style: italic;
      color: #0A0A0A; cursor: pointer;
      box-shadow: 0 0 28px rgba(201,168,76,0.25);
      transition: box-shadow 0.4s ease, transform 0.4s ease;
      letter-spacing: 0.04em;
    }
    .bring-btn:hover { box-shadow: 0 0 48px rgba(201,168,76,0.4); transform: translateY(-2px); }
  </style>
</head>
<body>
  <a href="/" class="back">← Gallery</a>
  <div class="screen">
    <div class="step-dots">
      <div class="dot done">1</div>
      <div class="dot done">2</div>
      <div class="dot done">3</div>
      <div class="dot done">4</div>
      <div class="dot done">5</div>
      <div class="dot done">6</div>
      <div class="dot active">7</div>
    </div>

    <h1>She's Ready</h1>
    <p class="subtitle">Everything below is what makes her yours. One tap and she comes to life.</p>

    <div class="preview-card">
      <div class="orb-wrap">
        <div class="orb-outer"></div>
        <div class="orb">
          <img src="/profile/nysa1.jpg" alt="NySa" />
        </div>
      </div>
      <div class="companion-name-display">NySa</div>
      <div class="companion-meta">The Slow Burn · Romantic connection</div>
      <div class="divider"></div>
      <div class="detail-row">
        <span class="detail-label">Intimate content</span>
        <span>On</span>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="back-btn">Back</button>
    <button class="bring-btn">Bring Her to Life</button>
  </div>
</body>
</html>
